name: Run tests
on: [push]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
    - name: Setup and run tests
      run: |
        set -xe
        #Install pre-reqs
        sudo apt update
        sudo apt install -y git curl openjdk-11-jdk

        #Install python 3.11
        sudo apt install wget build-essential libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev zlib1g-dev
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo apt install python3.11

        #Install Nextflow
        curl -s https://get.nextflow.io | bash
        chmod a+x nextflow
        cp nextflow /usr/local/bin


        python3.11 -m pip install pdm
      
        #Git setup
        git config --global user.email "it-support@gpas.global"
        git config --global user.name "gpas-github-bot"

        #Get the gpas repo and set it up
        git clone https://${{secrets.PAT_TOKEN}}@github.com/GlobalPathogenAnalysisService/gpas.git

        cd gpas

        python3.11 -m pdm install

        #Run the DB/API in the background
        python3.11 -m pdm run docker-up > pdm-docker.log &
        #Give it some time to start
        sleep 240

        python3.11 -m pdm run bootstrap

        python3.11 -m pdm run serve > pdm-serve.log &
        sleep 10
        
        #Give it some data and check we can access
        curl -SsL --header "Content-Type: application/json"  --request GET  http://0.0.0.0:8000/api/v1/relatedness/tb/neighbours\?run_id\=1 -H "Authorization: Basic test-api-key"


        #Hopefully exit the action
        exit 0

        





