name: Run tests
on: [push]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
    - name: Setup and run tests
      run: |
        set -xe
        #Install pre-reqs
        sudo apt update
        sudo apt install -y git curl openjdk-11-jdk jq

        #Install python 3.11
        sudo apt install wget build-essential libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev zlib1g-dev
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo apt install python3.11

        #Install Nextflow
        curl -s https://get.nextflow.io | bash
        chmod a+x nextflow
        cp nextflow /usr/local/bin


        python3.11 -m pip install pdm
      
        #Git setup
        git config --global user.email "it-support@gpas.global"
        git config --global user.name "gpas-github-bot"

        #Get the gpas repo and set it up
        git clone https://${{secrets.PAT_TOKEN}}@github.com/GlobalPathogenAnalysisService/gpas.git

        cd gpas

        python3.11 -m pdm install

        #Run the DB in the background
        python3.11 -m pdm run docker-up -d

        #Populate some data. This doesn't seem to work though...
        python3.11 -m pdm run bootstrap

        #Setup the API
        python3.11 -m pdm run serve 2> pdm-serve.log &
        sleep 30
        
        #Give it some data and check we can access
        cd ..
        git clone https://${{secrets.PAT_TOKEN}}@github.com/GlobalPathogenAnalysisService/fn5_pipeline.git
        cd fn5_pipeline
        git checkout add-tests

        bash test/bootstrap.sh

        sudo nextflow run . -profile docker --api_url http://127.0.0.1:8000 --sample $(pwd)/test/sample.fasta --api_token test-api-key --species test --run_id 1 --testing true

        sudo nextflow run . -profile docker --api_url http://127.0.0.1:8000 --sample $(pwd)/test/sample2.fasta --api_token test-api-key --species test --run_id 2 --testing true

        curl -SsL --header "Content-Type: application/json"  --request GET  http://127.0.0.1:8000/api/v1/relatedness/test/neighbours\?run_id\=1 -H "Authorization: Basic test-api-key"


        curl -SsL --header "Content-Type: application/json"  --request GET  http://127.0.0.1:8000/api/v1/samples -H "Authorization: Basic test-api-key"

        curl -SsL --header "Content-Type: application/json"  --request GET  http://127.0.0.1:8000/api/v1/relatedness/test/neighbours\?run_id\=1 -H "Authorization: Basic test-api-key"


        #Hopefully exit the action
        sleep 20
        cat ../gpas/pdm-serve.log
        exit 0

        





