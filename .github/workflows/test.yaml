name: Run tests
on:
  workflow_dispatch:
  pull_request:
    branches:
      - "*"

jobs:
  test:
    name: Run tests

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: "${{ secrets.PAT_TOKEN }}"
        fetch-depth: 0

    - name: Setup and run tests
      run: |
        set -xe
        #Install pre-reqs
        sudo apt update
        sudo apt install -y git curl openjdk-17-jdk jq python3 python3-dev

        #Docker login so we can pull. Both with and without sudo for `[sudo] nextflow run`
        docker login lhr.ocir.io -u ${{secrets.OCR_USERNAME}} -p $(echo "${{secrets.OCR_TOKEN}}")
        sudo docker login lhr.ocir.io -u ${{secrets.OCR_USERNAME}} -p $(echo "${{secrets.OCR_TOKEN}}")

        #Install python 3.11
        sudo apt install wget build-essential libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev zlib1g-dev
        sudo add-apt-repository ppa:deadsnakes/ppa
        sudo apt install python3.11 python3.11-dev

        #Install Nextflow
        curl -s https://get.nextflow.io | bash 2> /dev/null
        chmod a+x nextflow
        cp nextflow /usr/local/bin

        #Build test cases with known distances
        python3.11 test/build-test-set.py

        # Setup local file structure
        bash local_setup.sh

        #Run tests
        sudo bash test/test.sh "${{secrets.API_KEY}}" ${{vars.SAMPLE_ID}}
