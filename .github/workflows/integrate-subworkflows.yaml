name: Integrate subworkflows
on:
  release:
    types: [released, prereleased]

jobs:
  trigger-action:
    name: Trigger action
    runs-on: ubuntu-latest

    steps:
    - name: Send workflow dispatch
      run: |
        #Ensure curl is installed
        sudo apt update --fix-missing && sudo apt install -y curl

        curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{secrets.PAT_TOKEN}}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/GlobalPathogenAnalysisService/gpas-tb-workflow/actions/workflows/pull_sub_workflows.yaml/dispatches \
          -d '{"ref": "main"}'